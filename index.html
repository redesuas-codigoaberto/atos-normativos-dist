<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>O site mudou de endereço</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://redesuas-codigoaberto.github.io/sistema-atos-dist/">
<script>
  // O mesmo caminho, a query e o # no site novo: /atos-normativos-dist/leitor/?a=x → /sistema-atos-dist/leitor/?a=x
  var p = location.pathname.replace(/^\/atos-normativos-dist(\/|$)/, "/sistema-atos-dist/");
  if (p.indexOf("/sistema-atos-dist/") !== 0) p = "/sistema-atos-dist/";
  location.replace(p + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://redesuas-codigoaberto.github.io/sistema-atos-dist/"></noscript>
</head>
<body>
<p>O site mudou para <a href="https://redesuas-codigoaberto.github.io/sistema-atos-dist/">https://redesuas-codigoaberto.github.io/sistema-atos-dist/</a>.</p>
</body>
</html>
